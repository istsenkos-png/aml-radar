<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AML Radar — Pro</title>
<style>
:root{
 --bg:#070a12;--panel:#0e1320;--panel2:#121827;--line:#20283a;
 --text:#f5f7fb;--muted:#8b95a8;--soft:#b9c2d1;
 --red:#ff5b67;--amber:#ffb84d;--green:#42d392;--blue:#6ea8ff;
}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#18243d 0%,transparent 55%),var(--bg);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:100px}
.header{padding:22px 18px 12px;position:sticky;top:0;z-index:10;background:rgba(7,10,18,.86);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#dce8ff,#5d8cff);display:grid;place-items:center;color:#07101e;font-weight:900;box-shadow:0 8px 28px #4e80ff33}
h1{font-size:21px;letter-spacing:-.4px;margin:0}.eyebrow{font-size:10px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.live{margin-left:auto;font-size:10px;color:var(--green);display:flex;align-items:center;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;overflow:visible;padding:11px 16px;background:rgba(7,10,18,.78);position:sticky;top:83px;z-index:9}.tab{border:1px solid var(--line);background:#0c111c;color:#9ba6b9;border-radius:999px;padding:9px 7px;font-size:11px;white-space:nowrap;width:100%;text-align:center}.tab.on{background:#edf3ff;color:#07101e;border-color:#edf3ff;font-weight:750}
main{padding:14px 14px 0}
.hero{border:1px solid #27334b;background:linear-gradient(145deg,#121b2d,#0b101b);border-radius:22px;padding:17px;box-shadow:0 18px 50px #0006;margin-bottom:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}.hero-title{font-size:18px;font-weight:800;letter-spacing:-.4px}.date{font-size:10px;color:var(--muted);margin-top:4px}
.signal{font-size:10px;padding:6px 8px;border-radius:8px;background:#42d39218;color:var(--green);border:1px solid #42d3922c}
.hero-text{font-size:12px;line-height:1.45;color:#9da8ba;margin:11px 0 13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff08;border:1px solid #ffffff0b;border-radius:12px;padding:10px}.stat b{font-size:18px}.stat span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 3px 8px}.section-head h2{font-size:14px;margin:0}.section-head span{font-size:10px;color:var(--muted)}
.card{background:linear-gradient(145deg,#101622,#0c111b);border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0;box-shadow:0 10px 30px #0002}
.card:hover{border-color:#34415b}.topline{display:flex;justify-content:space-between;align-items:center}.badge{font-size:9px;font-weight:850;letter-spacing:.7px;padding:5px 7px;border-radius:7px}.must{color:var(--red);background:#ff5b6714;border:1px solid #ff5b6726}.imp{color:var(--amber);background:#ffb84d14;border:1px solid #ffb84d26}.use{color:var(--green);background:#42d39212;border:1px solid #42d39224}
.title{font-size:15px;font-weight:760;line-height:1.28;margin:9px 0 5px}.desc{font-size:12px;line-height:1.5;color:#a5afbf}.why{font-size:11px;line-height:1.45;color:#d4d9e2;margin-top:10px;padding-top:10px;border-top:1px solid #ffffff08}.meta{font-size:9px;color:#69758a;margin-top:10px}.meta a{color:#7eaaff;text-decoration:none}
.star{border:0;background:none;font-size:19px;color:#5d687b;padding:0}.star.on{color:#fff}
.source-card{display:flex;justify-content:space-between;align-items:center}.source-card b{font-size:13px}.source-card small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.source-card a{color:#78a8ff;text-decoration:none;font-size:11px}
.term b{font-size:15px}.ru{font-size:12px;color:#9fa9b9;margin-top:4px}.en{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;background:#070b13;border:1px solid #20283a;color:#c9d3e3;padding:10px;border-radius:10px;margin-top:9px}
.search{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:#0c111b;color:#fff;outline:0;margin-bottom:10px}.search::placeholder{color:#68748a}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(7,10,18,.9);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.07)}.bottomin{max-width:760px;margin:auto;display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
.nav{border:0;background:none;color:#657187;font-size:10px;min-width:64px}.nav .ico{font-size:18px;line-height:20px}.nav.on{color:#fff}.nav.on .ico{filter:drop-shadow(0 0 7px #fff5)}
.note{font-size:10px;line-height:1.45;color:#68748a}

/* v2 intelligence UI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.kpi{background:linear-gradient(145deg,#101725,#0b1019);border:1px solid var(--line);border-radius:16px;padding:13px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-30px;top:-30px;background:#6ea8ff12}
.kpi .n{font-size:22px;font-weight:850;letter-spacing:-.5px}.kpi .l{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.7px;text-transform:uppercase}
.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:#283246}
.event{position:relative;padding:0 0 14px 14px}.event:before{content:"";position:absolute;left:-17px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #6ea8ff12}.event b{font-size:11px}.event span{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.score{display:flex;align-items:center;gap:9px;margin-top:11px}.scorebar{height:5px;flex:1;border-radius:99px;background:#1a2231;overflow:hidden}.scorefill{height:100%;border-radius:99px;background:linear-gradient(90deg,#42d392,#6ea8ff)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:9px;color:#aeb8c9;border:1px solid #273146;background:#0b1019;padding:5px 7px;border-radius:7px}
.detail{background:linear-gradient(145deg,#121a2a,#0b1019);border:1px solid #28354d;border-radius:19px;padding:16px;margin:10px 0}.detail h3{margin:0;font-size:17px}.detail h4{font-size:11px;margin:15px 0 5px;color:#dce3ee}.detail p{font-size:12px;line-height:1.5;color:#a8b2c2;margin:0}
.chart{display:flex;align-items:end;gap:7px;height:105px;padding:12px 6px 0}.bar{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(to top,#6ea8ff55,#6ea8ff);min-height:12px}.barlabel{font-size:8px;color:#6e7a8f;text-align:center;margin-top:5px}
.action{display:block;width:100%;border:1px solid #2b3b58;background:#101a2b;color:#dfe8f7;border-radius:11px;padding:10px;text-align:center;font-size:11px;margin-top:11px;text-decoration:none}

.ai-panel{border:1px solid #293852;background:linear-gradient(145deg,#111b2d,#0b111c);border-radius:18px;padding:14px;margin:12px 0}
.ai-head{display:flex;justify-content:space-between;align-items:center}.ai-title{font-size:13px;font-weight:800}.ai-badge{font-size:9px;color:#6ea8ff;background:#6ea8ff14;border:1px solid #6ea8ff25;padding:5px 7px;border-radius:7px}
.ai-line{font-size:11px;color:#9ba7ba;line-height:1.45;margin-top:8px}.ai-controls{display:flex;gap:7px;margin-top:10px}.ai-btn{flex:1;border:1px solid #29364d;background:#0b111c;color:#dce5f4;border-radius:10px;padding:9px 6px;font-size:10px}.ai-btn.on{background:#eaf1ff;color:#0b1220;border-color:#eaf1ff;font-weight:750}
</style>

</head>
<body>
<div class="app">
<header class="header">
 <div class="brand">
  <div class="logo">R</div>
  <div><h1>AML Radar</h1><div class="eyebrow">Intelligence · Compliance · Crypto</div></div>
  <div class="live"><i class="dot"></i>LIVE</div>
 </div>
</header>
<div class="tabs" id="tabs">
<button class="tab on" data-cat="All">For You</button>
<button class="tab" data-cat="AML">AML</button>
<button class="tab" data-cat="Sanctions">Sanctions</button>
<button class="tab" data-cat="Crypto">Crypto</button>
<button class="tab" data-cat="Enforcement">Enforcement</button>
<button class="tab" data-cat="Jobs">Jobs</button>
</div>
<main id="main"></main>
</div>
<div class="bottom"><div class="bottomin">
<button class="nav on" data-view="radar"><div class="ico">⌂</div>Radar</button>
<button class="nav" data-view="sources"><div class="ico">◉</div>Sources</button>
<button class="nav" data-view="english"><div class="ico">Aa</div>English</button>
<button class="nav" data-view="saved"><div class="ico">☆</div>Saved</button>
</div></div>
<script src="feed.js"></script>
<script>
const LIVE_ITEMS=(window.RADAR_FEED&&window.RADAR_FEED.items)||[];
const data=[...LIVE_ITEMS,
{cat:"AML",level:"must",score:96,source:"FATF",date:"Sep 2026",title:"Targeted update: Virtual Assets & VASPs",desc:"FATF's 2026 update focuses on implementation gaps around regulation, licensing and registration, Travel Rule implementation and risk-based supervision.",why:"Directly relevant to crypto AML and your FATF/VASP learning.",tags:["VA/VASP","Travel Rule","RBA"],url:"https://www.fatf-gafi.org/en/publications/Fatfrecommendations/targeted-updated-virtualassets-vasps-2026.html"},
{cat:"AML",level:"must",score:94,source:"AMLA",date:"2026",title:"Ongoing monitoring of business relationships",desc:"AMLA is developing common EU guidance on how obliged entities should monitor customers and transactions according to risk.",why:"Core AML Analyst knowledge: ongoing CDD and transaction monitoring.",tags:["CDD","Monitoring","EU"],url:"https://www.amla.europa.eu/policy/public-consultations/consultation-draft-guidelines-ongoing-monitoring-business-relationship_en"},
{cat:"Crypto",level:"imp",score:89,source:"ESMA",date:"24 Sep 2026",title:"MiCA Register updated",desc:"ESMA's Interim MiCA Register includes crypto-asset service providers, white papers and non-compliant entities.",why:"Useful for CASP due diligence and crypto compliance.",tags:["MiCA","CASP","Due diligence"],url:"https://www.esma.europa.eu/da/node/201529"},
{cat:"Crypto",level:"imp",score:84,source:"ESMA",date:"23 Sep 2026",title:"New supervisory priority: digital innovation",desc:"ESMA published a new supervisory priority focused on digital innovation in EU financial markets.",why:"Helps track the direction of EU financial supervision.",tags:["Supervision","Innovation","EU"],url:"https://www.esma.europa.eu/press-news/esma-news"},
{cat:"Sanctions",level:"use",score:76,source:"FATF",date:"Jun 2026",title:"Recommendation 6 updated",desc:"FATF's June 2026 plenary updated Recommendation 6 concerning targeted financial sanctions and humanitarian exemptions.",why:"Useful for understanding sanctions implementation and financial restrictions.",tags:["Sanctions","TFS","R.6"],url:"https://www.fatf-gafi.org/en/publications/Fatfgeneral/outcomes-fatf-plenary-june-2026.html"},
{cat:"Sanctions",level:"use",score:72,source:"Export controls",date:"Reference",title:"Dual-use goods",desc:"Goods, software and technology can have both civilian and military applications and may create sanctions/export-control risk.",why:"Important terminology for sanctions compliance and transaction due diligence.",tags:["Dual-use","Export control","EDD"],url:"https://www.sanctionsmap.eu/"},
{cat:"Jobs",level:"imp",score:91,source:"Career Radar",date:"Target",title:"AML Analyst · KYC · Financial Crime · Crypto Compliance",desc:"Track roles in Estonia, Finland and Remote EU, then compare requirements with your current skills.",why:"This is the career target of the dashboard.",tags:["Tallinn","Remote EU","AML"],url:"https://www.linkedin.com/jobs/search/?keywords=AML%20Analyst&location=Estonia"}
 ];
const seedData=data.slice(0,0);
const sources=[
["AMLA","EU AML/CFT authority","https://www.amla.europa.eu/"],
["ESMA","EU securities & crypto regulation","https://www.esma.europa.eu/press-news/esma-news"],
["FATF","Global AML standards & typologies","https://www.fatf-gafi.org/en/the-fatf/news.html"],
["Finantsinspektsioon","Estonian financial supervisor","https://www.fi.ee/en/news"],
["EU Sanctions Map","EU sanctions information","https://www.sanctionsmap.eu/"],
["OFAC","US sanctions programs","https://ofac.treasury.gov/sanctions-programs-and-country-information"]
];
const terms=[
["Sanctions screening","Проверка клиента или транзакции по санкционным спискам.","The analyst reviewed the sanctions screening hit."],
["Dual-use goods","Товары двойного назначения.","The company assessed the end user of the dual-use goods."],
["Beneficial owner","Конечное физическое лицо, которое владеет или контролирует клиента.","Identify the beneficial owner before onboarding."],
["Source of funds","Источник конкретных денежных средств.","The analyst requested evidence of the source of funds."],
["Source of wealth","Как и из каких источников сформировалось состояние клиента.","The customer provided documents supporting source of wealth."],
["Adverse media","Негативная информация из открытых источников.","The analyst conducted an adverse media check."],
["Ongoing monitoring","Постоянный контроль клиента и его операций.","Ongoing monitoring should reflect the customer's risk profile."],
["Risk-based approach","Риск-ориентированный подход.","The firm applies a risk-based approach to CDD."]
];
let cat="All",view="radar",saved=JSON.parse(localStorage.getItem("amlRadarSaved")||"[]");
function card(x,i){x={...x,score:aiScore(x)};return `<article class="card" onclick="openItem(${i})"><div class="topline"><span class="badge ${x.level}">${x.level==="must"?"MUST READ":x.level==="imp"?"IMPORTANT":"USEFUL"}</span><button class="star ${saved.includes(i)?"on":""}" onclick="event.stopPropagation();save(${i})">${saved.includes(i)?"★":"☆"}</button></div><div class="title">${x.title}</div><div class="desc">${x.desc}</div><div class="score"><span style="font-size:10px;color:#9ba7ba">RELEVANCE</span><div class="scorebar"><div class="scorefill" style="width:${x.score}%"></div></div><b style="font-size:11px">${x.score}</b></div><div class="chips">${x.tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div><div class="meta">${x.source} · ${x.date} · <a href="${x.url}" target="_blank" onclick="event.stopPropagation()">primary source ↗</a></div></article>`}


const AI_PROFILE={
 target:["aml analyst","financial crime","crypto compliance","kyc","sanctions","transaction monitoring"],
 high:["amla","fatf","mica","casp","vasp","travel rule","sanctions","enforcement","ongoing monitoring","beneficial owner","transaction monitoring","source of funds","source of wealth","dual-use"],
 medium:["fraud","fintech","payments","digital assets","regulation","supervision","risk"],
 low:["price","token","meme","market rally","bull","bear"]
};
function aiScore(x){
 const text=(x.title+" "+x.desc+" "+x.why+" "+x.tags.join(" ")).toLowerCase();
 let s=45;
 AI_PROFILE.high.forEach(k=>{if(text.includes(k))s+=5});
 AI_PROFILE.medium.forEach(k=>{if(text.includes(k))s+=2});
 AI_PROFILE.low.forEach(k=>{if(text.includes(k))s-=7});
 if(x.cat==="Jobs")s+=8;
 if(x.source==="AMLA"||x.source==="FATF"||x.source==="ESMA")s+=4;
 return Math.max(0,Math.min(99,s));
}
function aiLabel(s){return s>=85?"HIGH SIGNAL":s>=70?"RELEVANT":"LOW SIGNAL"}
function aiPanel(){
 return `<div class="ai-panel"><div class="ai-head"><div class="ai-title">AI relevance engine</div><span class="ai-badge">PERSONALIZED</span></div>
 <div class="ai-line">Анализирует содержание относительно твоей цели: <b>AML Analyst → Financial Crime → Crypto Compliance</b>. В этой автономной версии scoring работает локально; внешний AI API можно подключить через backend без хранения ключа в iPhone.</div>
 <div class="ai-controls"><button class="ai-btn on" onclick="setSort('relevance')">Highest relevance</button><button class="ai-btn" onclick="setSort('latest')">Latest</button></div></div>`
}
let sortMode="relevance";
function setSort(m){sortMode=m;render()}

function openItem(i){
 const x=data[i], m=document.getElementById("main");
 m.innerHTML=`<div class="detail">
 <div class="topline"><span class="badge ${x.level}">${x.level==="must"?"MUST READ":x.level==="imp"?"IMPORTANT":"USEFUL"}</span><button class="star ${saved.includes(i)?"on":""}" onclick="save(${i});openItem(${i})">${saved.includes(i)?"★":"☆"}</button></div>
 <h3 style="margin-top:12px">${x.title}</h3>
 <div class="meta">${x.source} · ${x.date}</div>
 <div class="score"><span style="font-size:10px;color:#9ba7ba">RELEVANCE</span><div class="scorebar"><div class="scorefill" style="width:${aiScore(x)}%"></div></div><b>${aiScore(x)}/100</b></div>
 <div class="chips">${x.tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
 <h4>WHAT HAPPENED</h4><p>${x.desc}</p>
 <h4>WHY IT MATTERS FOR YOU</h4><p>${x.why}</p>
 <h4>AI ANALYSIS</h4><p>This item matches your selected AML/crypto profile based on source, topic and terminology. The production version can replace this local classifier with an LLM that reads the full article and produces a cited summary.</p><h4>AML INTERVIEW ANGLE</h4><p>Be ready to explain the risk-based approach, what evidence an analyst would review, and how the issue affects customer due diligence or monitoring.</p>
 <a class="action" href="${x.url}" target="_blank">Open primary source ↗</a>
 <button class="action" onclick="render()">← Back to Radar</button>
 </div>`;
}
function dashboard(){
 return `<div class="kpi-grid">
 <div class="kpi"><div class="n">96</div><div class="l">Top relevance</div></div>
 <div class="kpi"><div class="n">7</div><div class="l">Signals today</div></div>
 <div class="kpi"><div class="n">4</div><div class="l">Regulators</div></div>
 <div class="kpi"><div class="n">1</div><div class="l">Career target</div></div>
 </div>
 <div class="section-head"><h2>Regulatory pulse</h2><span>LAST 7 DAYS</span></div>
 <div class="card"><div class="chart">
 <div style="flex:1"><div class="bar" style="height:40%"></div><div class="barlabel">AML</div></div>
 <div style="flex:1"><div class="bar" style="height:72%"></div><div class="barlabel">MiCA</div></div>
 <div style="flex:1"><div class="bar" style="height:55%"></div><div class="barlabel">SANCTIONS</div></div>
 <div style="flex:1"><div class="bar" style="height:84%"></div><div class="barlabel">VASP</div></div>
 <div style="flex:1"><div class="bar" style="height:48%"></div><div class="barlabel">FRAUD</div></div>
 </div></div>
 <div class="section-head"><h2>Regulatory timeline</h2><span>EU / GLOBAL</span></div>
 <div class="card"><div class="timeline">
 <div class="event"><b>24 Sep · ESMA</b><span>MiCA Register update</span></div>
 <div class="event"><b>23 Sep · ESMA</b><span>Digital innovation supervisory priority</span></div>
 <div class="event"><b>Jun · FATF</b><span>Recommendation 6 update</span></div>
 <div class="event"><b>2026 · AMLA</b><span>Ongoing monitoring guidance</span></div>
 </div></div>`;
}
function render(){
 const m=document.getElementById("main");
 if(view==="sources"){m.innerHTML='<div class="section-head"><h2>Primary sources</h2><span>TRUSTED</span></div>'+sources.map(s=>`<div class="card source-card"><div><b>${s[0]}</b><small>${s[1]}</small></div><a href="${s[2]}" target="_blank">Open ↗</a></div>`).join("")+`<p class="note">News is collected locally by update_radar.py. Last update: ${window.RADAR_FEED?.updated_at||'not yet run'}. No server is required.</p>`;return}
 if(view==="english"){m.innerHTML='<div class="section-head"><h2>AML English</h2><span>8 TERMS</span></div><input class="search" placeholder="Search terminology..." oninput="filterTerms(this.value)"><div id="terms">'+terms.map(t=>`<div class="card term"><b>${t[0]}</b><div class="ru">${t[1]}</div><div class="en">${t[2]}</div></div>`).join("")+'</div>';return}
 let arr=view==="saved"?data.filter((_,i)=>saved.includes(i)):data.filter(x=>cat==="All"||x.cat===cat);
arr=[...arr].sort((a,b)=>sortMode==="latest"?(String(b.date).localeCompare(String(a.date))):aiScore(b)-aiScore(a));
 let html=`<section class="hero"><div class="hero-top"><div><div class="hero-title">Your AML Brief</div><div class="date">LIVE FEED · ${window.RADAR_FEED?.updated_at||"LOCAL"} · EUROPE</div></div><span class="signal">● HIGH SIGNAL</span></div><div class="hero-text">Главные изменения в AML, sanctions, crypto regulation и financial crime — отфильтрованные под твою цель.</div><div class="stats"><div class="stat"><b>${data.filter(x=>x.level==="must").length}</b><span>MUST READ</span></div><div class="stat"><b>${data.filter(x=>x.level==="imp").length}</b><span>IMPORTANT</span></div><div class="stat"><b>${data.filter(x=>x.cat==="Jobs").length}</b><span>JOBS</span></div></div></section>${(view==="radar"&&cat==="All")?dashboard():""}${view==="radar"?aiPanel():""}<div class="section-head"><h2>${view==="saved"?"Saved intelligence":"Top signals"}</h2><span>${arr.length} ITEMS</span></div>`;
 html+=arr.map(x=>card(x,data.indexOf(x))).join("");m.innerHTML=html
}
function save(i){saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];localStorage.setItem("amlRadarSaved",JSON.stringify(saved));render()}
function filterTerms(q){document.querySelectorAll(".term").forEach(e=>e.style.display=e.innerText.toLowerCase().includes(q.toLowerCase())?"":"none")}
document.querySelectorAll("#tabs .tab").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;view="radar";document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()});
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()});
render();
</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body></html>
